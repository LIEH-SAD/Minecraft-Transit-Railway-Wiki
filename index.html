<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Wiki</title>
    <link rel="icon" href="https://free.picui.cn/free/2026/07/27/6a6730054968d.png" type="image/x-icon">

    <!-- ===== 第三方库 (CDN) ===== -->
    <!-- Markdown 解析 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
    <!-- 代码高亮 -->
    <link rel="stylesheet" href="https://unpkg.com/@highlightjs/cdn-assets@11.10.0/styles/github.min.css" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="https://unpkg.com/@highlightjs/cdn-assets@11.10.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
    <script src="https://unpkg.com/@highlightjs/cdn-assets@11.10.0/highlight.min.js" defer></script>

    <!-- ===== 自定义样式 ===== -->
    <link rel="stylesheet" href="css/wiki.css?v=7">

    <!-- ===== PWA 支持 ===== -->
    <meta name="theme-color" content="#1976D2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
    <!-- ===== 应用壳 ===== -->
    <div id="app">
        <!-- 顶部应用栏 -->
        <header id="app-bar" class="md-app-bar">
            <button id="menu-toggle" class="md-icon-btn" aria-label="打开导航菜单" title="菜单">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
            </button>
            <a href="#/" class="md-app-bar__title" id="app-title">Wiki</a>
            <div class="md-app-bar__spacer"></div>
            <!-- 搜索框 -->
            <div class="md-search" id="search-container">
                <svg class="md-search__icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input type="text" class="md-search__input" id="search-input" placeholder="搜索 Wiki..." aria-label="搜索">
                <button class="md-search__clear" id="search-clear" aria-label="清除搜索">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
            <!-- 主题切换 -->
            <button id="theme-toggle" class="md-icon-btn" aria-label="切换主题" title="切换深色/浅色主题">
                <svg class="theme-icon-light" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
                </svg>
                <svg class="theme-icon-dark" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
                </svg>
            </button>
        </header>

        <!-- 主布局 -->
        <div id="layout" class="md-layout">
            <!-- 侧边导航抽屉 -->
            <aside id="sidebar" class="md-drawer" role="navigation" aria-label="Wiki 导航">
                <nav class="md-drawer__nav">
                    <div class="md-drawer__section">
                        <span class="md-drawer__section-title">导航</span>
                        <ul class="md-nav-list" id="nav-list">
                            <!-- 由 JS 动态生成 -->
                        </ul>
                    </div>
                    <div class="md-drawer__section">
                        <span class="md-drawer__section-title">页面</span>
                        <ul class="md-nav-list" id="page-list">
                            <!-- 由 JS 动态生成 -->
                        </ul>
                    </div>
                </nav>
                <div class="md-drawer__footer">
                    <span id="page-count"></span>
                    <a href="sponsor.html" class="md-drawer__sponsor" target="_self">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        赞助支持
                    </a>
                </div>
            </aside>

            <!-- 遮罩层 (移动端) -->
            <div id="drawer-overlay" class="md-overlay"></div>

            <!-- 主内容区 -->
            <main id="content" class="md-content">
                <div id="content-loader" class="md-loader">
                    <div class="md-loader__cradle" aria-label="加载中">
                        <div class="cradle__top"></div>
                        <div class="cradle__pendulum" style="--i:0">
                            <div class="cradle__string"></div>
                            <div class="cradle__ball"></div>
                        </div>
                        <div class="cradle__pendulum" style="--i:1">
                            <div class="cradle__string"></div>
                            <div class="cradle__ball"></div>
                        </div>
                        <div class="cradle__pendulum" style="--i:2">
                            <div class="cradle__string"></div>
                            <div class="cradle__ball"></div>
                        </div>
                        <div class="cradle__pendulum" style="--i:3">
                            <div class="cradle__string"></div>
                            <div class="cradle__ball"></div>
                        </div>
                        <div class="cradle__pendulum" style="--i:4">
                            <div class="cradle__string"></div>
                            <div class="cradle__ball"></div>
                        </div>
                    </div>
                </div>
                <article id="content-body" class="md-content__body"></article>
            </main>
        </div>

        <!-- 页脚: 上下页导航 + 赞助 -->
        <footer id="page-footer" class="md-footer">
            <div class="md-footer__inner">
                <a id="footer-prev" class="md-footer__link md-footer__link--prev" href="#">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    <span class="md-footer__label">上一页</span>
                    <span id="footer-prev-title" class="md-footer__title"></span>
                </a>
                <a id="footer-next" class="md-footer__link md-footer__link--next" href="#">
                    <span class="md-footer__label">下一页</span>
                    <span id="footer-next-title" class="md-footer__title"></span>
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                </a>
            </div>
            <div class="md-footer__sponsor">
                <a href="sponsor.html" rel="noopener" id="footer-sponsor" class="md-footer__sponsor-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    爱发电赞助
                </a>
            </div>
        </footer>
    </div>

    <!-- ===== 自定义脚本 ===== -->
    <script src="js/wiki-theme.js?v=7"></script>
    <script src="js/wiki-markdown.js?v=7"></script>
    <script src="js/wiki-router.js?v=7"></script>
    <script src="js/wiki-app.js?v=7"></script>
</body>
</html>
